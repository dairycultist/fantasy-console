<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fantasy Console</title>
    <script>

        // design
        // (statements) default | nested | initial | final
        // (expressions) input | round | diamond

        const blockCategories = {
            "control": {
                "topColor": "#f73",
                "bottomColor": "#d50",
                "strokeColor": "#850"
            },
            "action": {
                "topColor": "#67e",
                "bottomColor": "#45c",
                "strokeColor": "#45c"
            },
            "operator": {
                "topColor": "#6e0",
                "bottomColor": "#4c0",
                "strokeColor": "green"
            }
        };

        const blockTypes = {
            "receiveGo": {
                "format": "When program starts",
                "design": "initial",
                "category": "control"
            },
            "doRepeat": {
                "format": "Repeat _ times",
                "design": "nested",
                "category": "control"
            },
            "bubble": {
                "format": "Say _",
                "design": "default",
                "category": "action"
            },
            "forward": {
                "format": "Forward _",
                "design": "default",
                "category": "action"
            },
            "turn": {
                "format": "Turn _",
                "design": "default",
                "category": "action"
            },
            "doWait": {
                "format": "Wait _ seconds",
                "design": "default",
                "category": "action"
            },
            "reportVariadicSum": {
                "format": "_ + _",
                "design": "round",
                "category": "operator"
            },
            "int": { "design": "input" },
            "float": { "design": "input" },
            "string": { "design": "input" }
        };

        const script = [
            { "type": "receiveGo" },
            {
                "type": "doRepeat",
                "args": [
                    { "type": "int", "value": 10 }
                ],
                "children": [
                    { "type": "forward", "args": [ { "type": "int", "value": 10 } ] },
                    { "type": "turn", "args": [ { "type": "int", "value": 15 } ] },
                    {
                        "type": "bubble",
                        "args": [
                            {
                                "type": "reportVariadicSum",
                                "args": [
                                    { "type": "int", "value": "5" },
                                    {
                                        "type": "reportVariadicSum",
                                        "args": [
                                            { "type": "int", "value": "20" },
                                            { "type": "int", "value": "17" }
                                        ]
                                    }
                                ]
                            }
                        ]
                    },
                    { "type": "doWait", "args": [ { "type": "float", "value": 0.2 } ] }
                ]
            },
            {
                "type": "bubble",
                "args": [
                    {
                        "type": "string",
                        "value": "Hello!"
                    }
                ]
            },
        ];

        let render;

        function rerender() {

            if (!render)
                render = document.getElementById("canvas").getContext("2d");

            render.clearRect(0, 0, render.canvas.width, render.canvas.height);

            let x = 20, y = 20;

            for (const block of script)
                x, y = drawStatement(x, y, block);
        }

        // blocks that stack vertically with other blocks and maybe contain other blocks
        // returns next x,y to draw at
        function drawStatement(x, y, statement) {

            if (!blockTypes[statement.type]) {

                console.log("Skipping unknown block (type: \"" + statement.type + "\")");
                return 0;
            }

            const design = blockTypes[statement.type].design;
            const category = blockCategories[blockTypes[statement.type].category] ?? {
                "topColor": "#bbb",
                "bottomColor": "#888",
                "strokeColor": "#555"
            };

            // if we have any, process all children so we know where this block ends
            let newX = x;
            let newY = y + 30;

            if (design == "nested") {

                newX += 20;

                for (const arg of statement.children)
                    newX, newY = drawStatement(newX, newY, arg);

                newX -= 20;
            }

            // draw ourselves
            const grad = render.createLinearGradient(0, y, 0, y + 30);

            render.strokeStyle = category.strokeColor;
            grad.addColorStop(0, category.topColor);
            grad.addColorStop(1, category.bottomColor);

            let width = calculateBlockWidth(statement);

            const nubOffset = design == "nested" ? 20 : 0;

            render.fillStyle = grad;
            render.lineJoin = "round";
            render.lineWidth = 2;

            render.beginPath();
            render.moveTo(x, y);

            if (design != "initial") {

                render.lineTo(x + 5, y);
                render.lineTo(x + 10, y + 5);
                render.lineTo(x + 15, y + 5);
                render.lineTo(x + 20, y);
            }

            render.lineTo(x + width, y);
            render.lineTo(x + width, y + 30);

            render.lineTo(x + 20 + nubOffset, y + 30);
            render.lineTo(x + 15 + nubOffset, y + 35);
            render.lineTo(x + 10 + nubOffset, y + 35);
            render.lineTo(x + 5  + nubOffset, y + 30);

            if (design != "nested") {

                render.lineTo(x, y + 30);

            } else {

                render.lineTo(x + nubOffset, y + 30);
                render.lineTo(x + nubOffset, newY);

                render.lineTo(x + 5  + nubOffset, newY);
                render.lineTo(x + 10 + nubOffset, newY + 5);
                render.lineTo(x + 15 + nubOffset, newY + 5);
                render.lineTo(x + 20 + nubOffset, newY);

                render.lineTo(x + width, newY);
                render.lineTo(x + width, newY + 10);

                render.lineTo(x + 20, newY + 10);
                render.lineTo(x + 15, newY + 15);
                render.lineTo(x + 10, newY + 15);
                render.lineTo(x + 5, newY + 10);

                render.lineTo(x, newY + 10);

                newY += 10;
            }

            render.closePath();
            render.fill();
            render.stroke();

            drawTextAndArguments(x + 8, y + 20, statement);

            return newX, newY;
        }

        function calculateBlockWidth(block) {

            if (!blockTypes[block.type]) {

                console.log("Skipping unknown block (type: \"" + block.type + "\")");
                return 0;
            }

            let width = 0;

            switch (blockTypes[block.type].design) {

                case "input":
                    render.font = "15px Arial";
                    width = render.measureText("" + block.value).width + 8; break;
                case "default":
                case "nested":
                case "initial":
                case "final":
                case "round":
                case "diamond":
                    render.font = "bold 15px Arial";
                    width += render.measureText(blockTypes[block.type].format.replace("_", "")).width + 17;
                    if (block.args)
                        for (const arg of block.args)
                            width += calculateBlockWidth(arg);
                    break;
            }

            return width;
        }

        function drawTextAndArguments(x, y, block) {

            if (!blockTypes[block.type]) {

                console.log("Skipping unknown block (type: \"" + block.type + "\")");
                return 0;
            }

            const parts = blockTypes[block.type].format.split("_");

            for (let i = 0; i < parts.length - 1; i++) {

                // draw the text
                render.save();

                render.shadowColor = "black";
                render.shadowBlur = 4;
                render.shadowOffsetX = 1;
                render.shadowOffsetY = 1;
                render.fillStyle = "white";
                render.font = "bold 15px Arial";

                render.fillText(parts[i], x, y);

                x += render.measureText(parts[i]).width;

                render.restore();

                // draw the following argument
                x += drawExpression(x, y, block.args[i]);
            }

            // draw the last part of text
            render.save();

            render.shadowColor = "black";
            render.shadowBlur = 4;
            render.shadowOffsetX = 1;
            render.shadowOffsetY = 1;
            render.fillStyle = "white";
            render.font = "bold 15px Arial";

            render.fillText(parts[parts.length - 1], x, y);
            render.restore();
        }

        // blocks that slot into other blocks
        // returns its width
        function drawExpression(x, y, expression) {

            if (!blockTypes[expression.type]) {

                console.log("Skipping unknown block (type: \"" + expression.type + "\")");
                return 0;
            }

            const width = calculateBlockWidth(expression);
            const category = blockCategories[blockTypes[expression.type].category] ?? {
                "topColor": "#bbb",
                "bottomColor": "#888",
                "strokeColor": "#555"
            };

            const grad = render.createLinearGradient(0, y - 10, 0, y + 10);

            render.strokeStyle = category.strokeColor;
            grad.addColorStop(0, category.topColor);
            grad.addColorStop(1, category.bottomColor);

            render.fillStyle = grad;

            switch (blockTypes[expression.type].design) {

                case "input":
                    render.strokeStyle = "grey";
                    render.fillStyle = "white";
                    render.lineWidth = 1;

                    render.fillRect(x, y - 15, width, 20);
                    render.strokeRect(x, y - 15, width, 20);

                    render.fillStyle = "black";
                    render.font = "15px Arial";
                    render.fillText("" + expression.value, x + 4, y);
                    break;
                
                case "round":
                    render.lineWidth = 1;

                    render.beginPath();
                    render.roundRect(x, y - 17, width, 24, 12);
                    render.fill();
                    render.stroke();

                    drawTextAndArguments(x + 13, y, expression);
                    break;
            }

            return width;
        }
    </script>
</head>
<body onload="rerender();">
    <canvas id="canvas" width="600" height="600" style="border: 1px solid black;"></canvas>
</body>
</html>
